scenes:
  - type: intro
    data:
      kicker: "GTA 6 · el mapa"
      title: "Leonida, zona por zona"
      subtitle: "Las 6 regiones que ha mostrado Rockstar"
    lines:
      - "GTA 6 nos lleva al estado de Leonida, la versión de Rockstar de Florida."
      - "Y no es solo Vice City: hay pantanos, islas, pueblos de costa y bosques enormes."
      - "Vamos a recorrer las seis zonas que Rockstar ha mostrado, y en qué lugares reales se inspiran."

  - type: map
    chapter: "Vice City y los Keys"
    data:
      heading: "El sur"
      note: "Mapa ilustrativo: posiciones aproximadas."
      regions:
        - { id: vice-city, name: "Vice City", real: "Miami", desc: "La gran ciudad: playas, neones, coches de lujo y vida nocturna sin descanso." }
        - { id: keys, name: "Leonida Keys", real: "Cayos de Florida", desc: "Cadena de islas al sur, entre puentes, barcos y contrabando." }
    reveal: [1, 2]
    lines:
      - "Empezamos por el sur, que es donde está el corazón del juego."
      - "Vice City es la gran ciudad, inspirada en Miami: playas, neones, coches de lujo y una vida nocturna que no para."
      - "Justo debajo, los Leonida Keys, una cadena de islas inspirada en los cayos de Florida. Allí arranca buena parte de la historia de Jason, entre barcos y contrabando."

  - type: map
    chapter: "Pantanos y golfo"
    data:
      heading: "Pantanos y golfo"
      note: "Mapa ilustrativo: posiciones aproximadas."
      context: [vice-city, keys]
      regions:
        - { id: grassrivers, name: "Grassrivers", real: "Everglades", desc: "Pantanos salvajes: caimanes, hidrodeslizadores y muy poca ley." }
        - { id: port-gellhorn, name: "Port Gellhorn", real: "Costa del Golfo", desc: "Un pueblo costero que vivió tiempos mejores." }
    reveal: [1, 2]
    lines:
      - "Hacia el interior, el paisaje cambia por completo."
      - "Grassrivers es la zona de pantanos, inspirada en los Everglades: caimanes, hidrodeslizadores y muy poca ley."
      - "Y al noroeste, en la costa del Golfo, está Port Gellhorn, un pueblo costero que vivió tiempos mejores."

  - type: map
    chapter: "Interior y norte"
    data:
      heading: "Interior y norte"
      note: "Mapa ilustrativo: posiciones aproximadas."
      context: [vice-city, keys, grassrivers, port-gellhorn]
      regions:
        - { id: ambrosia, name: "Ambrosia", real: "Interior agrícola", desc: "Zona industrial del interior, marcada por su refinería de azúcar." }
        - { id: kalaga, name: "Mount Kalaga", real: "Bosques del norte", desc: "Parque nacional: bosque, ríos, caza y caminos de tierra." }
    reveal: [1, 2]
    lines:
      - "Subimos hacia el centro y el norte."
      - "Ambrosia es la zona industrial del interior, marcada por su refinería de azúcar, y por gente con la que mejor no cruzarse."
      - "Y arriba del todo, el parque nacional de Mount Kalaga: bosque, ríos, caza y caminos de tierra para perderse."

  - type: bullets
    chapter: "Lo visto en los tráileres"
    data:
      heading: "Lo que ya hemos visto de Leonida"
      items:
        - { icon: phone, text: "Vídeos virales al estilo redes sociales" }
        - { icon: music, text: "Fiesta y vida nocturna en Vice City" }
        - { icon: car, text: "Coches tuneados, atascos y persecuciones" }
        - { icon: waves, text: "Playas, barcos y lanchas por toda la costa" }
    lines:
      - "Y por lo que se ha visto en los tráileres, Leonida está muy viva."
      - "Hay vídeos virales al estilo de las redes sociales, con la sátira de siempre de Rockstar."
      - "Fiesta y vida nocturna en Vice City."
      - "Coches tuneados, atascos y persecuciones."
      - "Y mucho mar: playas, barcos y lanchas por toda la costa."

  - type: stat
    chapter: "¿Cómo de grande es?"
    data:
      value: "6"
