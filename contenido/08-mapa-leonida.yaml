        - "Grassrivers y Port Gellhorn"
        - "Ambrosia y Mount Kalaga"
      next: "Personajes: quién es quién"
      cta: "Suscríbete"
    lines:
      - "Resumen: Vice City y los Keys al sur, los pantanos de Grassrivers, Port Gellhorn en el golfo, Ambrosia en el interior, y Mount Kalaga al norte."
      - "¿Cuál es la primera zona que vas a explorar? Te leo en los comentarios."
      - "Nos vemos en Leonida."
