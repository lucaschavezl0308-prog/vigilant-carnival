      sub: "Ojo con las comparaciones de tamaño: muchas son estimaciones de fans"
      icon: pin
    lines:
      - "Seis regiones, cada una con su propia identidad, en un único mapa."
      - "Ojo con las cifras de tamaño que circulan por ahí: muchas son estimaciones de fans hechas a partir de los tráileres."
      - "Lo que está claro es que habrá mucho más que descubrir de lo que se ha enseñado."

  - type: outro
    chapter: "Resumen"
    data:
      title: "Resumen"
      points:
