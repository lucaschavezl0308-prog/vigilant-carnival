youtube:
  title: "¿GTA 6 tiene online? Lo que hay el día 19 (y lo que no)"
  description: |
    ¿Se puede jugar GTA 6 online desde el lanzamiento? Rockstar presenta GTA 6 como una experiencia para un jugador. Repasamos qué está confirmado, qué no (fecha, crossplay, formato), qué se rumorea sobre 2027 y qué pasa con el GTA Online de siempre.
  tags: [gta 6, gta 6 online, gta 6 multijugador, gta 6 tiene online, gta online 6, gta 6 online fecha, gta 6 crossplay, gta 6 jugar con amigos, gta 6 2027, gta vi online]
  hashtags: ["#GTA6", "#GTAVI", "#GTAOnline"]
  pinned: "GTA 6 sale como experiencia para un jugador. No hay fecha oficial para el online. Si alguien te ofrece una 'beta' de GTA 6 Online, es estafa."
  next: "El mapa de GTA 6, zona por zona"
thumbnail:
  top: "¿GTA 6"
  big: "ONLINE?"
  tag: "DÍA 1"
  visual: online
scenes:
  - type: intro
    data:
      kicker: "GTA 6 · multijugador"
      title: "¿Tiene online?"
      subtitle: "Qué hay el día 19 y qué viene después"
    lines:
      - "Mucha gente da por hecho que el día 19 podrá entrar con sus amigos a liarla por Vice City."
      - "Pero ojo, porque el lanzamiento de GTA 6 no funciona así."
      - "Te explico qué hay confirmado sobre el online, qué se rumorea, y qué pasa con el GTA Online que ya conoces."

  - type: quote
    chapter: "Lo confirmado"
    data:
      text: "Una experiencia para un jugador"
      source: "Así presenta Rockstar GTA 6 en el anuncio de reservas y en las tiendas"
    lines:
      - "Lo confirmado es esto: Rockstar presenta GTA 6 como una experiencia para un jugador."
      - "Así aparece en el anuncio de las reservas y en las fichas de las tiendas."
      - "En otras palabras: el día del lanzamiento, GTA 6 es la historia de Jason y Lucia, sin modo online."

  - type: bullets
    chapter: "Lo que no se sabe"
    data:
      heading: "Lo que NO está confirmado"
      items:
        - { icon: calendar, text: "Fecha del modo online" }
        - { icon: chat, text: "Nombre o formato" }
        - { icon: users, text: "Juego cruzado entre consolas" }
        - { icon: sliders, text: "Cómo se jugaría" }
    lines:
      - "¿Y qué no se sabe? Prácticamente todo lo demás."
      - "No hay fecha para un modo online."
      - "No hay nombre ni formato oficial."
      - "No se ha confirmado juego cruzado entre PlayStation y Xbox."
      - "Y no hay detalles de cómo se jugaría."

  - type: warning
    chapter: "Los rumores"
    data:
      heading: "Lo que se rumorea"
      icon: info
      items:
        - "Muchos esperan el online en 2027"
        - "Un documental lo sugirió… pero era una frase del guion"
        - "Rockstar no ha dado ninguna fecha"
    lines:
      - "Ahora, los rumores, que hay que tomar con pinzas."
      - "La expectativa general es que el multijugador llegue más adelante, y se habla mucho de 2027."
      - "Un documental de Bloomberg lo dio a entender, pero el periodista Jason Schreier aclaró después que esa frase era del guionista, no información confirmada."
      - "Así que, a día de hoy, cualquier fecha es especulación."

  - type: bullets
    chapter: "¿Y GTA Online?"
    data:
      heading: "¿Y el GTA Online de siempre?"
      items:
        - { icon: globe, text: "Sigue funcionando con GTA V" }
        - { icon: gamepad, text: "Tu progreso sigue ahí", sub: "Rockstar no ha anunciado ningún cierre" }
        - { icon: shield, text: "Ojo con 'betas' e invitaciones falsas" }
    lines:
      - "¿Y qué pasa con el GTA Online de siempre?"
      - "Sigue funcionando con GTA V, así que si quieres jugar con amigos mientras tanto, ese es tu sitio."
      - "Tu progreso sigue ahí, y Rockstar no ha anunciado ningún cierre."
      - "Y un aviso: si alguien te ofrece acceso a una beta o una invitación para el online de GTA 6, desconfía. Es la estafa típica de estas fechas."

  - type: outro
    chapter: "Resumen"
    data:
      title: "Resumen"
      points:
        - "GTA 6 sale solo con historia"
        - "Sin fecha para el online"
        - "GTA Online sigue con GTA V"
      next: "El mapa de GTA 6"
      cta: "Suscríbete"
    lines:
      - "Resumen: GTA 6 sale como experiencia para un jugador, no hay fecha para el online, y GTA Online sigue ahí con GTA V."
      - "Cuando Rockstar anuncie algo, lo verás aquí."
      - "Suscríbete, y nos vemos en Leonida."
