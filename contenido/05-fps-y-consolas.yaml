    lines:
      - "La respuesta corta: no. Rockstar ha confirmado que GTA 6 apunta a 30 fotogramas por segundo en todas las consolas."
      - "Eso incluye PS5, PS5 Pro, y Xbox Series X y Series S."
      - "Y de momento no hay ningún modo rendimiento a 60 anunciado, ni para el lanzamiento ni para más adelante."

