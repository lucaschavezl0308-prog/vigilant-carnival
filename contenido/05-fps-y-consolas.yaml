  title: "GTA 6 a 30 FPS: PS5 vs PS5 Pro vs Xbox Series X y S, ¿dónde jugarlo?"
  description: |
    Rockstar ha confirmado que GTA 6 apunta a 30 fps en todas las consolas, incluida la PS5 Pro. Te explicamos por qué, qué gana la PS5 Pro (sombras con ray tracing y reescalado PSSR), qué pasa con la Xbox Series S y en qué consola te conviene jugarlo.
