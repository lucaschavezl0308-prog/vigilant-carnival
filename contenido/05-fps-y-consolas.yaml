    lines:
      - "Es la pregunta técnica que más se repite: ¿GTA 6 va a 60 fps?"
      - "Rockstar ya ha respondido, y la respuesta no es la que muchos esperaban."
      - "Te cuento qué ha confirmado, qué gana la PS5 Pro, qué pasa con la Series S, y en qué consola te conviene jugarlo."

