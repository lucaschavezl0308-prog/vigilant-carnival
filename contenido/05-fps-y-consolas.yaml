        - { icon: users, text: "Más gente, tráfico y vida a la vez" }
        - { icon: trend, text: "Red Dead Redemption 2 ya salió así" }
    lines:
      - "¿Por qué? Según Rockstar, la idea es exprimir las consolas al máximo."
      - "La prioridad es el mundo: más detalle en cada calle y en cada edificio."
      - "Más gente, más tráfico, y más cosas pasando a la vez."
      - "Y no es la primera vez: Red Dead Redemption 2 también salió a 30 en consolas, y es de los juegos mejor valorados de su generación."

