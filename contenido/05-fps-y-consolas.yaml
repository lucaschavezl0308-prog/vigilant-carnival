      - "En PS5 y en Series X tendrás 30 fps con buena calidad de imagen, aunque Rockstar no ha detallado resoluciones."
      - "La PS5 Pro se queda en los mismos 30, pero añade dos cosas exclusivas: sombras con ray tracing, y el reescalado PSSR de Sony, que da una imagen más nítida."
      - "En resumen: la Pro gana en imagen, no en fluidez."

