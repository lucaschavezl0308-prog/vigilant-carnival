    lines:
      - "Antes de pensar en Vice City, hay una pregunta muy terrenal: ¿te cabe GTA 6 en la consola?"
      - "Porque este juego es enorme, y si tienes el disco lleno, la noche del lanzamiento puede convertirse en una noche borrando juegos."
      - "Te cuento cuánto ocupa, cuánto espacio te queda en cada consola, y cómo hacer sitio sin perder nada."

  - type: stat
    chapter: "Cuánto ocupa"
    data:
      value: "212"
