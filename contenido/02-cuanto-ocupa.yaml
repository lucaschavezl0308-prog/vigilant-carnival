    lines:
      - "Ahora, la realidad de cada consola, con el espacio útil que traen de fábrica."
      - "Una PS5 original tiene unos 667 GB útiles: con GTA 6 instalado te quedarían unos 455."
      - "La PS5 Slim, con alrededor de 848 GB útiles, va bastante más holgada."
      - "La Xbox Series X ofrece unos 802 GB útiles, así que también hay margen."
      - "Y el caso delicado es la Series S de 512 GB: solo unos 364 útiles. GTA 6 se llevaría más de la mitad."

  - type: table
    chapter: "Tiempo de descarga"
    data:
      heading: "¿Cuánto tarda en bajar?"
      columns: ["Tu conexión", "Tiempo teórico"]
      rows:
        - ["100 megas", "≈ 4 h 45 min"]
        - ["300 megas", "≈ 1 h 35 min"]
        - ["600 megas", "≈ 47 min"]
        - ["1 giga", "≈ 28 min"]
      note: "Cálculo para 212 GB a velocidad máxima. El día del lanzamiento irá más lento."
    lines:
      - "¿Y cuánto tarda en descargarse? Depende de tu conexión."
      - "Con 100 megas, en teoría, unas cuatro horas y tres cuartos."
      - "Con 300 megas, hora y media larga."
      - "Con 600 megas, algo menos de una hora."
      - "Y con fibra de un giga, alrededor de media hora."
      - "Pero eso es en condiciones ideales. El día del lanzamiento, con millones de descargas a la vez, irá más lento, así que no lo dejes para el último minuto."

  - type: bullets
    chapter: "Cómo hacer sitio"
    data:
      heading: "Cómo hacer sitio sin perder nada"
      items:
        - { icon: sliders, text: "Mira qué ocupa más en Almacenamiento" }
        - { icon: camera, text: "Borra o pasa al móvil capturas y clips" }
        - { icon: x, text: "Desinstala lo que no juegas", sub: "Tus partidas guardadas no se borran" }
        - { icon: hard-drive, text: "Mueve juegos a un disco USB", sub: "Para guardarlos, no para jugarlos" }
    lines:
      - "Si te falta espacio, haz esto en orden."
      - "Primero, entra en el menú de almacenamiento de la consola y mira qué ocupa más. Muchas veces la sorpresa son las capturas y los clips de vídeo."
      - "Segundo, borra o pasa al móvil esas capturas que ya no necesitas."
      - "Tercero, desinstala los juegos que no estás jugando. Tranquilo: tus partidas guardadas no se borran al desinstalar."
      - "Y cuarto, si tienes un disco USB, mueve ahí los juegos que quieras conservar. Los de esta generación no se pueden jugar desde el USB, pero te ahorras volver a descargarlos."

  - type: compare
    chapter: "Ampliar almacenamiento"
    data:
      heading: "¿Necesitas ampliar?"
      left:
        title: "PS5"
        icon: gamepad
        items:
          - "SSD M.2 NVMe PCIe 4.0"
          - "Sony recomienda 5.500 MB/s o más"
          - "Con disipador"
          - "Va en la ranura de expansión"
      right:
        title: "Xbox Series"
        icon: gamepad
        items:
          - "Tarjeta de expansión compatible"
          - "Se conecta por detrás, sin abrir nada"
          - "Los juegos se ejecutan desde ella"
          - "Suele salir más cara por GB"
      verdict: "Un disco USB normal sirve para guardar juegos, no para jugar a GTA 6"
    reveal: [1, 2, 3]
    lines:
      - "Y si la solución pasa por ampliar, esto es lo que necesitas."
      - "En PS5, un SSD M.2 NVMe de tipo PCIe 4.0. Sony recomienda 5.500 MB/s o más, y que lleve disipador."
      - "En Xbox Series, una tarjeta de expansión compatible, que se conecta por detrás sin abrir la consola, aunque suele salir más cara por giga."
      - "Y recuerda: un disco USB normal sirve para almacenar, pero GTA 6 tendrá que ejecutarse desde el disco interno o desde una ampliación compatible."

