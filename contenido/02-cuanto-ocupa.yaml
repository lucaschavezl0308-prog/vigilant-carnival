      countUp: true
      label: "Tamaño máximo de descarga"
      sub: "Cifra máxima indicada para PS5 y Xbox Series. Los parches pueden sumar más."
      icon: hard-drive
    lines:
      - "La cifra que se ha dado es de hasta 212 GB."
      - "Es un máximo: según la consola, la instalación puede quedarse algo por debajo."
      - "Pero ojo, porque los parches del lanzamiento y las actualizaciones posteriores pueden hacerlo crecer."
      - "Así que lo sensato es tener entre 230 y 250 GB libres."

  - type: storage
    chapter: "Espacio en cada consola"
    data:
