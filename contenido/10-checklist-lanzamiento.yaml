youtube:
  title: "Checklist GTA 6: 10 cosas que hacer antes de empezar a jugar"
  description: |
    Llega la noche del lanzamiento de GTA 6. Diez cosas para tener listas antes de empezar: hora de desbloqueo, descarga y espacio, actualización de la consola, descargas en reposo, modo juego de la tele, calibración HDR, mando y auriculares, spoilers y capturas. Y tres cosas que no debes hacer.
  tags: [gta 6, gta 6 lanzamiento, gta 6 checklist, gta 6 consejos, gta 6 antes de jugar, gta 6 hdr, gta 6 ajustes, gta 6 modo juego, gta 6 spoilers, gta 6 primera noche, gta vi tips]
  hashtags: ["#GTA6", "#GTAVI", "#GTA6Lanzamiento"]
  pinned: "Guárdalo para la noche del lanzamiento ✅ ¿Desde qué consola vas a jugar? 👇"
  next: "¿A qué hora sale GTA 6?"
thumbnail:
  top: "ANTES DE"
  big: "JUGAR"
