scenes:
  - type: intro
    data:
      kicker: "GTA 6 · noche de lanzamiento"
      title: "Checklist antes de jugar"
      subtitle: "10 cosas para llegar listo"
    lines:
      - "Llega la noche del lanzamiento. Lo último que quieres es estar a medianoche peleándote con una descarga o con la tele."
      - "Aquí tienes diez cosas que hacer antes de empezar, para que lo único que te quede sea darle a jugar."

  - type: checklist
    chapter: "Antes de medianoche"
    data:
      heading: "1-5 · Antes de medianoche"
      items:
        - "Comprueba tu hora de desbloqueo"
        - "Descarga terminada (o empezada ya)"
        - "Deja libres 230-250 GB"
        - "Actualiza el sistema de la consola"
        - "Activa las descargas en reposo"
    lines:
      - "Primero, lo técnico."
      - "Uno: comprueba a qué hora se desbloquea en tu país. Tienes el horario en el canal."
      - "Dos: si lo has comprado en digital, asegúrate de que la descarga está terminada. Y si no la has empezado, empieza ya."
      - "Tres: deja libres entre 230 y 250 GB, porque los parches también ocupan."
      - "Cuatro: actualiza el sistema de la consola, para que no te pille una actualización a medianoche."
      - "Y cinco: activa las descargas en modo reposo, así la consola sigue bajando el juego o el parche mientras duermes."

  - type: checklist
    chapter: "Imagen y sonido"
    data:
      heading: "6-8 · Imagen y sonido"
      items:
        - "Tele en modo juego"
        - "Calibra el HDR de la consola"
        - "Mando cargado y auriculares listos"
    lines:
      - "Ahora, imagen y sonido."
      - "Seis: pon la tele en modo juego. Reduce el retraso entre lo que pulsas y lo que ves."
      - "Siete: calibra el HDR. En PS5 lo tienes en los ajustes de pantalla y vídeo, y en Xbox, en la calibración de HDR para juegos."
      - "Ocho: mando cargado, cable a mano y auriculares listos, porque la banda sonora de un GTA merece la pena."

  - type: checklist
    chapter: "Para disfrutarlo"
    data:
      heading: "9-10 · Para disfrutarlo"
      items:
        - "Silencia palabras clave en redes"
        - "Haz sitio para tus capturas y clips"
    reveal: [1, 2]
    lines:
      - "Y por último, para disfrutarlo de verdad."
      - "Nueve: silencia palabras clave en tus redes. En cuanto salga, la historia va a estar por todas partes."
      - "Diez: si vas a grabar o hacer capturas, deja espacio también para eso. Los clips de vídeo ocupan más de lo que parece."
      - "Y un extra que no sale en ninguna guía: agua, algo de cena, y una hora razonable para irte a dormir. Leonida no se va a ir a ninguna parte."

  - type: warning
    chapter: "Lo que NO debes hacer"
    data:
      heading: "Lo que NO debes hacer"
      icon: shield
      items:
        - "Descargar «GTA 6 para PC» o APK de móvil"
        - "Dar tu cuenta a cambio de «acceso anticipado»"
        - "Ver directos si no quieres spoilers"
    lines:
      - "Y tres cosas que no debes hacer."
      - "No descargues nada que diga GTA 6 para PC o para móvil: no existe, y suele ser malware."
      - "No des tus datos ni tu cuenta a nadie que te prometa acceso anticipado."
      - "Y si no quieres spoilers, ni se te ocurra entrar en directos de la historia la primera semana."

  - type: outro
    chapter: "Resumen"
    data:
      title: "Listo para Leonida"
      points:
        - "Descarga, espacio y actualización"
        - "Tele en modo juego y HDR calibrado"
        - "Cero spoilers"
      next: "¿A qué hora sale GTA 6?"
      cta: "Suscríbete"
    lines:
      - "Con esto, estás listo: descarga y espacio, tele en modo juego, HDR calibrado y redes silenciadas."
      - "Guarda este vídeo para la noche del lanzamiento, y cuéntame en los comentarios desde qué consola vas a jugar."
      - "Nos vemos en Leonida."
